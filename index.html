<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結婚式メッセージカメラ (合成録画対応)</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f4f4f7; }
    
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* プレビュー兼・録画元となるCanvas */
    #previewCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 裏でカメラ映像を受けるVideo要素（非表示） */
    #backgroundVideo { display: none; }

    .controls { margin-top: 20px; }
    button {
      padding: 12px 24px; font-size: 15px; margin: 5px;
      border: none; border-radius: 25px; cursor: pointer; font-weight: bold;
    }
    .btn-start { background: #007bff; color: white; }
    .btn-rec { background: #dc3545; color: white; }
    .btn-rec:disabled { background: #ccc; }
  </style>
</head>
<body>

  <h2>メッセージ動画を撮る</h2>

  <div class="camera-container">
    <canvas id="previewCanvas"></canvas>
    <video id="backgroundVideo" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-start" onclick="startCamera()">① カメラ起動</button>
    <button id="recBtn" class="btn-rec" onclick="toggleRecording()" disabled>② 録画開始</button>
  </div>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('backgroundVideo');
    const recBtn = document.getElementById('recBtn');
    
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let frameImage = new Image();
    let frameLoaded = false;

    // フレーム画像の事前読み込み
    frameImage.src = 'frame.png';
    frameImage.onload = () => { frameLoaded = true; };

    // ① カメラ映像とフレームをCanvasに毎フレーム描画
    function drawComposite() {
      if (video.paused || video.ended) return;

      // 9:16比率に合わせてカメラ映像を切り抜き描画
      const targetRatio = 9 / 16;
      const videoRatio = video.videoWidth / video.videoHeight;
      let sw, sh, sx, sy;

      if (videoRatio > targetRatio) {
        sh = video.videoHeight;
        sw = sh * targetRatio;
        sx = (video.videoWidth - sw) / 2;
        sy = 0;
      } else {
        sw = video.videoWidth;
        sh = sw / targetRatio;
        sx = 0;
        sy = (video.videoHeight - sh) / 2;
      }

      // 1. カメラ映像を描画
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

      // 2. フレーム画像を上に重ねる
      if (frameLoaded) {
        ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
      }

      requestAnimationFrame(drawComposite);
    }

    // ② アプリ・カメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: true
        });
        
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          // Canvas解像度を縦型フルHDに設定
          canvas.width = 1080;
          canvas.height = 1920;
          drawComposite();
        };

        // ③ Canvasの映像ストリームを取得
        const canvasStream = canvas.captureStream(30);

        // 【最重要】マイク音声を録画ストリームに統合（無音化防止）
        const audioTrack = stream.getAudioTracks()[0];
        if (audioTrack) {
          canvasStream.addTrack(audioTrack);
        }

        // 対応MIMEタイプの自動判定（iOS Safari対策）
        let options = {};
        if (MediaRecorder.isTypeSupported('video/mp4')) {
          options = { mimeType: 'video/mp4' };
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
          options = { mimeType: 'video/webm;codecs=vp9' };
        }

        mediaRecorder = new MediaRecorder(canvasStream, options);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = saveVideo;

        recBtn.disabled = false;
        document.getElementById('startBtn').disabled = true;
      } catch (err) {
        alert('カメラ・マイクの起動に失敗しました: ' + err);
      }
    }

    // ④ 録画の開始 / 停止
    function toggleRecording() {
      if (!isRecording) {
        recordedChunks = [];
        mediaRecorder.start();
        isRecording = true;
        recBtn.innerText = '■ 録画停止';
        recBtn.style.background = '#333';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = '② 録画開始';
        recBtn.style.background = '#dc3545';
      }
    }

    // ⑤ 保存処理
    function saveVideo() {
      const mimeType = mediaRecorder.mimeType || 'video/webm';
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(recordedChunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `wedding_message.${ext}`;
      a.click();
      URL.revokeObjectURL(url);
      
      alert('フレームが合成された動画の保存が完了しました！');
    }
  </script>
</body>
</html>
