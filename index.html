<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結婚式メッセージカメラ (合成保存版)</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f4f4f7; }
    
    /* プレビュー表示用コンテナ（9:16比率） */
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* カメラとフレームが合成描画されるCanvas */
    #previewCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* バックグラウンド処理用の非表示ビデオ */
    #backgroundVideo {
      display: none;
    }

    .controls { margin-top: 20px; }
    button {
      padding: 12px 24px; font-size: 15px; margin: 5px;
      border: none; border-radius: 25px; cursor: pointer; font-weight: bold;
    }
    .btn-start { background: #007bff; color: white; }
    .btn-rec { background: #dc3545; color: white; }
    .btn-rec:disabled { background: #ccc; }
  </style>
</head>
<body>

  <h2>メッセージ動画を撮る</h2>

  <div class="camera-container">
    <!-- カメラ映像＋フレーム画像が合成される描画キャンバス -->
    <canvas id="previewCanvas"></canvas>
    
    <!-- カメラの生映像を受けるビデオ要素（画面には表示されません） -->
    <video id="backgroundVideo" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-start" onclick="startApp()">① アプリ起動</button>
    <button id="recBtn" class="btn-rec" onclick="toggleRecording()" disabled>② 録画開始</button>
  </div>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('backgroundVideo');
    const startBtn = document.getElementById('startBtn');
    const recBtn = document.getElementById('recBtn');
    
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let frameImage;
    let userStream;

    // ① フレーム画像の読み込み (キャッシュ防止対策)
    function loadFrame() {
      return new Promise((resolve, reject) => {
        frameImage = new Image();
        frameImage.src = 'frame.png?v=' + new Date().getTime();
        frameImage.onload = () => resolve();
        frameImage.onerror = (e) => reject('frame.png の読み込みに失敗しました。');
      });
    }

    // ② カメラ映像とフレーム画像をキャンバスにリアルタイム合成描画
    function drawComposite() {
      if (video.paused || video.ended) return;

      // 1. カメラ映像を描画（アスペクト比調整）
      const targetAspectRatio = 9 / 16;
      const videoAspectRatio = video.videoWidth / video.videoHeight;
      
      let drawWidth, drawHeight, offsetX, offsetY;
      if (videoAspectRatio > targetAspectRatio) {
        drawHeight = video.videoHeight;
        drawWidth = drawHeight * targetAspectRatio;
        offsetX = (video.videoWidth - drawWidth) / 2;
        offsetY = 0;
      } else {
        drawWidth = video.videoWidth;
        drawHeight = drawWidth / targetAspectRatio;
        offsetX = 0;
        offsetY = (video.videoHeight - drawHeight) / 2;
      }

      // カメラ映像をCanvas全体に描画
      ctx.drawImage(video, offsetX, offsetY, drawWidth, drawHeight, 0, 0, canvas.width, canvas.height);

      // 2. フレーム画像をカメラ映像の上に重ねて描画
      if (frameImage) {
        ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
      }

      // 毎フレーム合成処理を継続
      requestAnimationFrame(drawComposite);
    }

    // ③ アプリ起動処理
    async function startApp() {
      try {
        await loadFrame();

        // カメラ・マイクのストリーム取得
        userStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1920 } },
          audio: true
        });
        
        video.srcObject = userStream;
        
        video.onloadedmetadata = () => {
          video.play();
          // Canvasの解像度をスマホ動画の解像度（1080x1920）に設定
          canvas.width = 1080;
          canvas.height = 1920;
          drawComposite();
        };

        // 【重要】合成後のCanvasから映像ストリームを取得 (30fps)
        const canvasStream = canvas.captureStream(30);

        // 【重要】マイクの音声トラックを合成ストリームに追加（無音化防止）
        const audioTrack = userStream.getAudioTracks()[0];
        if (audioTrack) {
          canvasStream.addTrack(audioTrack);
        }

        // スマホ（iOS / Android）で動作する形式を自動判別
        let options = {};
        if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) {
          options = { mimeType: 'video/mp4;codecs=avc1' };
        } else if (MediaRecorder.isTypeSupported('video/mp4')) {
          options = { mimeType: 'video/mp4' };
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
          options = { mimeType: 'video/webm;codecs=vp9' };
        } else if (MediaRecorder.isTypeSupported('video/webm')) {
          options = { mimeType: 'video/webm' };
        }

        // 合成ストリームを録画対象にセット
        mediaRecorder = new MediaRecorder(canvasStream, options);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = saveVideo;

        recBtn.disabled = false;
        startBtn.disabled = true;
        startBtn.innerText = 'カメラ起動中';
      } catch (err) {
        alert('起動に失敗しました。カメラ・マイクの許可、または frame.png の存在を確認してください。');
        console.error(err);
      }
    }

    // ④ 録画の開始・停止切り替え
    function toggleRecording() {
      if (!isRecording) {
        recordedChunks = [];
        mediaRecorder.start();
        isRecording = true;
        recBtn.innerText = '■ 録画停止';
        recBtn.style.background = '#333';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = '② 録画開始';
        recBtn.style.background = '#dc3545';
      }
    }

    // ⑤ 合成済み動画のダウンロード保存
    function saveVideo() {
      const mimeType = mediaRecorder.mimeType || 'video/webm';
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(recordedChunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `wedding_message_${Date.now()}.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
