<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結婚式メッセージカメラ</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f4f4f7; }
    
    /* 縦型スマホ画面の枠組 */
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    /* カメラの上に重ねるオリジナルフレームのデザイン */
    .frame-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      box-sizing: border-box;
      border: 10px solid rgba(212, 175, 55, 0.8); /* ゴールドの枠 */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .frame-title { color: #fff; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 4px #000; }
    .frame-footer { color: #fff; font-size: 14px; text-shadow: 1px 1px 4px #000; }

    .controls { margin-top: 20px; }
    button {
      padding: 12px 24px; font-size: 15px; margin: 5px;
      border: none; border-radius: 25px; cursor: pointer; font-weight: bold;
    }
    .btn-start { background: #007bff; color: white; }
    .btn-rec { background: #dc3545; color: white; }
    .btn-rec:disabled { background: #ccc; }
  </style>
</head>
<body>

  <h2>メッセージ動画を撮る</h2>

  <div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    
    <!-- オリジナルフレーム部分（CSSで重ね合わせ） -->
    <div class="frame-overlay">
      <div class="frame-title">Happy Wedding!</div>
      <div class="frame-footer">Taro & Hanako<br>2026.08.20</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-start" onclick="startCamera()">① カメラ起動</button>
    <button id="recBtn" class="btn-rec" onclick="toggleRecording()" disabled>② 録画開始</button>
  </div>

  <script>
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: true
        });
        document.getElementById('video').srcObject = stream;
        
        // 録画機能のセットアップ
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = saveVideo;

        document.getElementById('recBtn').disabled = false;
      } catch (err) {
        alert('カメラ・マイクの許可が必要です: ' + err);
      }
    }

    function toggleRecording() {
      const recBtn = document.getElementById('recBtn');
      if (!isRecording) {
        recordedChunks = [];
        mediaRecorder.start();
        isRecording = true;
        recBtn.innerText = '■ 録画停止';
        recBtn.style.background = '#333';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = '② 録画開始';
        recBtn.style.background = '#dc3545';
      }
    }

    // 撮影した動画をダウンロード保存する
    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'wedding_message.mp4';
      a.click();
      alert('動画の保存が完了しました！');
    }
  </script>
</body>
</html>
