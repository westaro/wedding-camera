<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結婚式メッセージカメラ (完全合成版)</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f4f4f7; }
    
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    #previewCanvas { width: 100%; height: 100%; object-fit: cover; }
    #backgroundVideo { display: none; }

    .controls { margin-top: 20px; }
    button {
      padding: 12px 24px; font-size: 15px; margin: 5px;
      border: none; border-radius: 25px; cursor: pointer; font-weight: bold;
    }
    .btn-start { background: #007bff; color: white; }
    .btn-rec { background: #dc3545; color: white; }
    .btn-rec:disabled { background: #ccc; }
  </style>
</head>
<body>

  <h2>メッセージ動画撮影</h2>

  <div class="camera-container">
    <canvas id="previewCanvas"></canvas>
    <video id="backgroundVideo" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button class="btn-start" onclick="startApp()">① カメラ起動</button>
    <button id="recBtn" class="btn-rec" onclick="toggleRecording()" disabled>② 録画開始</button>
  </div>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('backgroundVideo');
    const recBtn = document.getElementById('recBtn');
    
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let frameImage;
    let userStream;

    // Canva画像(frame.png)の読み込み
    function loadFrame() {
      return new Promise((resolve, reject) => {
        frameImage = new Image();
        frameImage.src = 'frame.png?v=' + new Date().getTime(); // キャッシュ防止
        frameImage.onload = () => resolve();
        frameImage.onerror = () => reject('frame.png の読み込みに失敗しました。ファイル名と配置場所を確認してください。');
      });
    }

    // 毎フレーム「カメラ映像 + frame.png」を重ねてCanvasに描画
    function drawComposite() {
      if (video.paused || video.ended) return;

      canvas.width = 1080;
      canvas.height = 1920;

      // 1. カメラ映像をアスペクト比を維持して中央描画
      const targetRatio = 9 / 16;
      const videoRatio = video.videoWidth / video.videoHeight;
      let sw, sh, sx, sy;

      if (videoRatio > targetRatio) {
        sh = video.videoHeight;
        sw = sh * targetRatio;
        sx = (video.videoWidth - sw) / 2;
        sy = 0;
      } else {
        sw = video.videoWidth;
        sh = sw / targetRatio;
        sx = 0;
        sy = (video.videoHeight - sh) / 2;
      }

      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

      // 2. Canvaのframe.pngを上から重ねて描画（埋め込み）
      if (frameImage) {
        ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
      }

      requestAnimationFrame(drawComposite);
    }

    async function startApp() {
      try {
        await loadFrame();

        userStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1920 } },
          audio: true
        });
        
        video.srcObject = userStream;
        
        video.onloadedmetadata = () => {
          video.play();
          drawComposite();
        };

        // Canvasの映像ストリームを取得 (30fps)
        const canvasStream = canvas.captureStream(30);

        // マイク音声を合成ストリームに追加（音声も動画に入れるため）
        const audioTrack = userStream.getAudioTracks()[0];
        if (audioTrack) {
          canvasStream.addTrack(audioTrack);
        }

        // ブラウザに応じた最適な録画形式(MIME Type)を自動選択
        let options = {};
        if (MediaRecorder.isTypeSupported('video/mp4')) {
          options = { mimeType: 'video/mp4' };
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
          options = { mimeType: 'video/webm;codecs=vp9' };
        } else if (MediaRecorder.isTypeSupported('video/webm')) {
          options = { mimeType: 'video/webm' };
        }

        mediaRecorder = new MediaRecorder(canvasStream, options);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = saveVideo;

        recBtn.disabled = false;
        alert('カメラとフレームの準備ができました！');
      } catch (err) {
        alert(err);
        console.error(err);
      }
    }

    function toggleRecording() {
      if (!isRecording) {
        recordedChunks = [];
        mediaRecorder.start();
        isRecording = true;
        recBtn.innerText = '■ 録画停止';
        recBtn.style.background = '#333';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = '② 録画開始';
        recBtn.style.background = '#dc3545';
      }
    }

    function saveVideo() {
      const mimeType = mediaRecorder.mimeType || 'video/webm';
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(recordedChunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `wedding_message_frame.${ext}`;
      a.click();
      
      URL.revokeObjectURL(url);
      alert('動画がダウンロードされました！動画内にCanvaのデザインが埋め込まれているか確認してください。');
    }
  </script>
</body>
</html>
