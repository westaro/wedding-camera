<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結婚式メッセージカメラ</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f4f4f7; }
    
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    #previewCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #backgroundVideo { display: none; }

    .controls { margin-top: 20px; }
    button {
      padding: 12px 24px; font-size: 15px; margin: 5px;
      border: none; border-radius: 25px; cursor: pointer; font-weight: bold;
    }
    .btn-start { background: #007bff; color: white; }
    .btn-rec { background: #dc3545; color: white; }
    .btn-rec:disabled { background: #ccc; }
  </style>
</head>
<body>

  <h2>メッセージ動画を撮る</h2>

  <div class="camera-container">
    <canvas id="previewCanvas"></canvas>
    <video id="backgroundVideo" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-start" onclick="startCamera()">① カメラ起動</button>
    <button id="recBtn" class="btn-rec" onclick="toggleRecording()" disabled>② 録画開始</button>
  </div>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('backgroundVideo');
    const startBtn = document.getElementById('startBtn');
    const recBtn = document.getElementById('recBtn');
    
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let frameImage = new Image();
    let frameLoaded = false;
    let userStream;

    frameImage.src = 'frame.png';
    frameImage.onload = () => { frameLoaded = true; };

    // 描画ループ（判定条件を緩和し、常にループを維持させて画面フリーズを防止）
    function drawComposite() {
      if (video.readyState >= 2 && !video.paused && !video.ended) {
        const targetRatio = 9 / 16;
        const videoRatio = video.videoWidth / video.videoHeight;
        let sw, sh, sx, sy;

        if (videoRatio > targetRatio) {
          sh = video.videoHeight;
          sw = sh * targetRatio;
          sx = (video.videoWidth - sw) / 2;
          sy = 0;
        } else {
          sw = video.videoWidth;
          sh = sw / targetRatio;
          sx = 0;
          sy = (video.videoHeight - sh) / 2;
        }

        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

        if (frameLoaded) {
          ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(drawComposite);
    }

    async function startCamera() {
      try {
        userStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: true
        });
        
        video.srcObject = userStream;
        
        video.onloadedmetadata = () => {
          video.play();
          canvas.width = 1080;
          canvas.height = 1920;
          drawComposite();
        };

        recBtn.disabled = false;
        startBtn.disabled = true;
      } catch (err) {
        alert('カメラ・マイクの起動に失敗しました: ' + err);
      }
    }

    // ブラウザが再生・保存に対応している形式を自動判定
    function getSupportedMimeType() {
      const types = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm'
      ];
      for (const type of types) {
        if (MediaRecorder.isTypeSupported(type)) {
          return type;
        }
      }
      return '';
    }

    function toggleRecording() {
      if (!isRecording) {
        recordedChunks = [];

        // 録画ボタンを押す度に新しい MediaRecorder を生成（再録画時の画面停止を防ぐ）
        const canvasStream = canvas.captureStream(30);
        const audioTrack = userStream.getAudioTracks()[0];
        
        const combinedStream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...(audioTrack ? [audioTrack] : [])
        ]);

        const mimeType = getSupportedMimeType();
        const options = mimeType ? { mimeType } : {};

        mediaRecorder = new MediaRecorder(combinedStream, options);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = saveVideo;

        mediaRecorder.start();
        isRecording = true;
        recBtn.innerText = '■ 録画停止';
        recBtn.style.background = '#333';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = '② 録画開始';
        recBtn.style.background = '#dc3545';
      }
    }

    function saveVideo() {
      const mimeType = mediaRecorder.mimeType || 'video/mp4';
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(recordedChunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `wedding_message_${Date.now()}.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
</html>
